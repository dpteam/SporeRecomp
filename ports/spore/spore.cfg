# Optional launcher settings — copy to /roms/ports/spore/spore.cfg and edit.
#
# Every value below is a default; uncomment a line to change it.

# Render resolution. Default: the panel size, detected at start.
# SPORE_RENDER=854x480

# Panel size, only if detection is wrong.
# SPORE_SCREEN=640x480

# Render below the panel resolution and upscale (faster on big screens).
# SPORE_RENDER_SCALE=0.75

# Panel mounted rotated (portrait panels default to 90).
# SPORE_ROTATE=90

# Logging: SPORE_VERBOSE logs every guest import call, SPORE_TRACE logs the first call of each.
# SPORE_VERBOSE=1
# SPORE_TRACE=1
