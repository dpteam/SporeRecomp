# Spore settings, read by spore.sh at launch.
#
# Logging. VERBOSE logs every guest import call (very noisy, useful when something is wrong);
# TRACE logs the first call of each import.
SPORE_VERBOSE=0
SPORE_TRACE=0
#
# Render resolution. Default: the panel size, detected at start.
# SPORE_RENDER=854x480
#
# Panel size, only if detection gets it wrong.
# SPORE_SCREEN=640x480
#
# Render below the panel resolution and upscale (faster on big screens).
# SPORE_RENDER_SCALE=0.75
#
# Panel mounted rotated.
# SPORE_ROTATE=90
